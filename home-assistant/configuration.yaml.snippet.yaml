      app_base: /local/witmind-ui
      fallback_release: 0.5.0

  - name: witmind-calendario-laboral-panel
    url_path: calendario-laboral
    sidebar_title: Calendario laboral
    sidebar_icon: mdi:calendar-lock
    module_url: /local/witmind-ui-panel.js?v=0.6.4
    require_admin: false
    config:
      panel_kind: calendar
      panel_id: calendar
      title: Calendario laboral
      app_base: /local/witmind-ui
      fallback_release: 0.5.0

  - name: notifications-panel
    url_path: notificaciones
    sidebar_title: Notificaciones Witmind
    sidebar_icon: mdi:bell-cog-outline
    module_url: /local/witmind-ui-panel.js?v=0.6.4
    require_admin: true
    config:
      panel_kind: notifications
      panel_id: notifications
      app_base: /local/witmind-ui
      fallback_release: 0.5.0

  - name: control-general-panel
    url_path: control-general
    sidebar_title: Control general
    sidebar_icon: mdi:shield-home-outline
    module_url: /local/witmind-ui-panel.js?v=0.6.4
    require_admin: false
    config:
      panel_kind: control
      panel_id: control
      app_base: /local/witmind-ui
      fallback_release: 0.5.0

  - name: witmind-energy-panel
    url_path: witmind-energy
    sidebar_title: Gestión de energía
    sidebar_icon: mdi:chart-line
    module_url: /local/witmind-ui-panel.js?v=0.6.4
    require_admin: false
    config:
      panel_kind: energy
      panel_id: energy
      app_base: /local/witmind-ui
      dev_url: http://192.168.20.44:5174/witmind-ui.html
      default_mode: stable
      fallback_release: 0.5.0
