# Merge these keys into the existing Home Assistant configuration.
witmind_core:

panel_custom:
  - name: witmind-ui-panel
    sidebar_title: Witmind Showroom
    sidebar_icon: mdi:view-dashboard-variant
    url_path: witmind-next
    module_url: /local/witmind-ui-panel.js?v=0.6.4
    require_admin: false
    config:
      panel_id: showroom
      app_base: /local/witmind-ui
      dev_url: http://192.168.20.44:5174/witmind-ui.html
      default_mode: stable
      fallback_release: 0.5.0

  - name: witmind-lobby-panel
    url_path: witmind-lobby
    sidebar_title: Witmind Lobby
    sidebar_icon: mdi:door-open
    module_url: /local/witmind-ui-panel.js?v=0.6.4
    require_admin: false
    config:
      panel_kind: lobby
      panel_id: lobby
      app_base: /local/witmind-ui
      dev_url: http://192.168.20.44:5174/witmind-ui.html
      default_mode: stable
      fallback_release: 0.5.0
      title: Lobby
      subtitle: Control operativo
      site_label: WTX · MDTC
      weather: weather.forecast_casa
      light_count_sensor: sensor.lobby_luminarias_encendidas
      energy_sensor: sensor.showroom_energia_estimada
      history_hours: 4
      chart_hours: 24
      show_forecast: true
      devices:
        - entity: switch.interruptor_inteligente_3_switch_1
          name: Central Colgante
          subtitle: Iluminación central
          icon: pendant
        - entity: switch.interruptor_inteligente_3_switch_2
          name: Spots 5W Decorativos
          subtitle: Iluminación decorativa
          icon: spot
        - entity: switch.interruptor_inteligente_3_switch_3
          name: Tira LED
          subtitle: Iluminación ambiental
          icon: strip
        - entity: switch.interruptor_inteligente_3_switch_4
          name: Spots 10W
          subtitle: Iluminación principal
          icon: spot
      scene_control_entities:
        - switch.interruptor_inteligente_3_switch_1
        - switch.interruptor_inteligente_3_switch_2
        - switch.interruptor_inteligente_3_switch_3
        - switch.interruptor_inteligente_3_switch_4
      scenes:
        - id: visita
          name: Visita
          subtitle: Todos los circuitos
          icon: presentation
          on_entities:
            - switch.interruptor_inteligente_3_switch_1
            - switch.interruptor_inteligente_3_switch_2
            - switch.interruptor_inteligente_3_switch_3
            - switch.interruptor_inteligente_3_switch_4
        - id: regular
          name: Regular
          subtitle: Solo Spots 10W
          icon: bulb
          on_entities:
            - switch.interruptor_inteligente_3_switch_4
          off_entities:
            - switch.interruptor_inteligente_3_switch_1
            - switch.interruptor_inteligente_3_switch_2
            - switch.interruptor_inteligente_3_switch_3

  - name: witmind-general-panel
    url_path: witmind-general
    sidebar_title: Control de Edificio
    sidebar_icon: mdi:office-building-cog-outline
    module_url: /local/witmind-ui-panel.js?v=0.6.4
    require_admin: false
    config:
      panel_kind: general
      panel_id: general
      static_only: true
      app_base: /local/witmind-ui
      dev_url: http://192.168.20.44:5174/witmind-ui.html
      default_mode: stable
      fallback_release: 0.5.0
      title: Control de Edificio
      subtitle: Sistema de gestión y monitoreo
      site_label: WTX · MDTC
      weather: weather.forecast_casa
      show_forecast: true

  # Paneles migrados a la UI Witmind. Conservan la misma URL y entidades;
  # solo cambia el bridge visual. Los watts son potencia nominal configurada.
  - name: oficinas-panel
    url_path: oficinas-control
    sidebar_title: Oficinas
    sidebar_icon: mdi:office-building-outline
    module_url: /local/witmind-ui-panel.js?v=0.6.4
    require_admin: false
    config:
      panel_kind: offices
      panel_id: offices
      app_base: /local/witmind-ui
      fallback_release: 0.5.0

  - name: sala-grabacion-panel
    url_path: sala-grabacion
    sidebar_title: Sala de grabación
    sidebar_icon: mdi:record-rec
    module_url: /local/witmind-ui-panel.js?v=0.6.4
    require_admin: false
