<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Witmind Showroom Panel - Home Assistant Panel Edition</title>
    <!-- Single Typographic System: Manrope Variable -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/node_modules/@fontsource-variable/manrope/index.css" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        min-height: 100dvh;
        background-color: #071118;
        color: #f5f6f4;
        font-family: "Manrope", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-feature-settings: "tnum" 1;
        font-variant-numeric: tabular-nums;
        overflow-x: hidden;
      }

      /* Dev Switcher Top Bar */
      .version-top-bar {
        display: none;
        background: rgba(16, 25, 30, 0.95);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 8px 24px;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        position: sticky;
        top: 0;
        z-index: 99999;
      }
      body.dev-mode .version-top-bar {
        display: flex;
      }

      .version-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .version-badge {
        background: #f26522;
        color: #ffffff;
        padding: 3px 10px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.04em;
      }
      .version-links {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .version-links a {
        color: rgba(255, 255, 255, 0.7);
        text-decoration: none;
        padding: 4px 12px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        font-size: 11px;
        font-weight: 600;
        transition: all 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .version-links a:hover {
        background: rgba(242, 101, 34, 0.16);
        color: #ffffff;
        border-color: #f26522;
      }
      .version-links a.current {
        background: rgba(242, 101, 34, 0.16);
        color: #f26522;
        border-color: #f26522;
        font-weight: 700;
      }

      showroom-panel {
        display: block;
        width: 100%;
        min-height: 100dvh;
      }
      body.dev-mode showroom-panel {
        min-height: calc(100dvh - 41px);
      }
    </style>
  </head>
  <body>
    <!-- Barra Superior de Navegación -->
    <div class="version-top-bar" id="devTopBar">
      <div class="version-brand">
        <span class="version-badge">HA PANEL v1.6.0</span>
        <strong>Showroom Panel - Architectural Edition</strong>
      </div>
      <div class="version-links">
        <a href="/showroom-panel.html" class="current">🎛️ Showroom Panel (Actualizado)</a>
        <a href="/showroom-witmind-signature.html">🏛️ Signature Oscuro</a>
        <a href="/showroom-witmind-signature-light.html">☀️ Signature Claro</a>
        <a href="/index.html">🏠 Portal</a>
      </div>
    </div>

    <!-- Componente Web Nativo Showroom Panel -->
    <showroom-panel id="showroomPanel"></showroom-panel>

    <!-- Proveedor Reactivo Mock Home Assistant -->
    <script src="/reference/witmind-os/mock/mock-hass.js"></script>

    <!-- Implementación Showroom Panel -->
    <script type="module" src="/src/showroom-panel.js"></script>

    <!-- Registro Reactivo del Mock Hass en el Panel -->
    <script>
      (function() {
        function initShowroomPanel() {
          if (new URLSearchParams(window.location.search).has("dev")) {
            document.body.classList.add("dev-mode");
          }
          const panel = document.getElementById("showroomPanel");
          if (panel && window.registerMockHassConsumer) {
            window.registerMockHassConsumer(panel);
          }
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", initShowroomPanel);
        } else {
          initShowroomPanel();
        }
      })();
    </script>
  </body>
</html>
